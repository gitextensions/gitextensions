name: Build Windows portable

on:
  workflow_dispatch:
  push:
    branches: [feature/side-by-side-staged-unstaged]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Create Plugins output dir
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path artifacts/Release/bin/GitExtensions/net10.0-windows/Plugins | Out-Null

      - name: Build
        run: dotnet build src/app/GitExtensions/GitExtensions.csproj -c Release

      - name: Publish (self-contained win-x64)
        run: dotnet publish src/app/GitExtensions/GitExtensions.csproj -c Release -r win-x64 --self-contained true -p:ErrorOnDuplicatePublishOutputFiles=false

      - name: Zip portable package
        shell: pwsh
        run: Compress-Archive -Path artifacts/Release/publish/GitExtensions/* -DestinationPath GitExtensions-portable-win-x64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GitExtensions-portable-win-x64
          path: GitExtensions-portable-win-x64.zip
          retention-days: 90
