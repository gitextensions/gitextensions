name: Build Windows portable

on:
  workflow_dispatch:
  push:
    branches: [feature/side-by-side-staged-unstaged]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build native code
        run: dotnet build src\native\build.proj -c Release --verbosity q --nologo

      - name: Build .NET (solution, from repo root)
        shell: pwsh
        run: dotnet build -c Release --verbosity q --nologo /p:ContinuousIntegrationBuild=true

      - name: Publish (solution, from repo root; CreatePortable auto-zips)
        shell: pwsh
        run: dotnet publish -c Release --no-build -r win-x64 --self-contained true /p:ContinuousIntegrationBuild=true /p:ErrorOnDuplicatePublishOutputFiles=false

      - name: Resolve portable archive name
        shell: pwsh
        run: |
          $zip = Get-ChildItem artifacts\Release\publish\*.zip | Select-Object -First 1
          if (-not $zip) { throw 'No publish zip found under artifacts\Release\publish' }
          "ZIPNAME=$($zip.Name)" >> $env:GITHUB_ENV

      - name: Upload portable archive
        uses: actions/upload-artifact@v4
        with:
          name: GitExtensions-portable-win-x64
          path: artifacts/Release/publish/*.zip
          retention-days: 90
