name: Build Windows portable

on:
  workflow_dispatch:
  push:
    branches: [feature/side-by-side-staged-unstaged]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build native code
        run: dotnet build src\native\build.proj -c Release --verbosity q --nologo

      - name: Publish (framework-dependent like upstream; CreatePortable auto-zips)
        shell: pwsh
        run: dotnet publish -c Release --verbosity q --nologo /p:ContinuousIntegrationBuild=true /p:ErrorOnDuplicatePublishOutputFiles=false

      - name: Upload portable archive
        uses: actions/upload-artifact@v4
        with:
          name: GitExtensions-portable-win-x64
          path: artifacts/Release/publish/*.zip
          retention-days: 90
